name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      # PhrenKit's markdown parsers are transcriptions of these. A format change
      # here with no matching Swift change is exactly the drift the fixture
      # tests exist to catch, so they have to actually run. (Duplicated rather
      # than shared via a YAML anchor: GitHub Actions does not support anchors.)
      - "packages/cli/src/content/**"
      - "packages/cli/src/core/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/data/access.ts"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      - "packages/cli/src/content/**"
      - "packages/cli/src/core/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/data/access.ts"
  workflow_dispatch:

# macOS runners bill at a 10x minute multiplier; superseded runs are wasted spend.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phrenkit-tests:
    name: PhrenKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Use the runner image's default Xcode — pinning an older version
      # conflicts with the project format Homebrew's current XcodeGen emits.
      - name: swift test
        working-directory: apps/ios/PhrenKit
        run: swift test

  app-build:
    name: App smoke build (iOS Simulator)
    runs-on: macos-15
    needs: phrenkit-tests
    steps:
      - uses: actions/checkout@v4
      # Deliberately unpinned, and worth knowing why: XcodeGen's emitted project
      # format is coupled to the Xcode version (see the note above), so pinning
      # one without the other trades a random break for a guaranteed one. Log
      # both versions instead, so a sudden failure is diagnosable from the run.
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Phren.xcodeproj \
            -scheme Phren \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
