name: iOS

# PhrenKit's markdown parsers are line-by-line transcriptions of the CLI's
# TypeScript, verified against fixtures the CLI generates (see
# apps/ios/README.md "The format contract"). A change to either side of that
# contract must run this suite — otherwise a TS format change silently
# desyncs the Swift port and nothing fails until a user's file is mangled.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      - "packages/cli/src/content/**"
      - "packages/cli/src/data/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/governance/policy.ts"
      - "packages/cli/src/core/**"
      - "packages/cli/src/task/**"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      - "packages/cli/src/content/**"
      - "packages/cli/src/data/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/governance/policy.ts"
      - "packages/cli/src/core/**"
      - "packages/cli/src/task/**"
  workflow_dispatch:

jobs:
  phrenkit-tests:
    name: PhrenKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Use the runner image's default Xcode — pinning an older version
      # conflicts with the project format Homebrew's current XcodeGen emits.
      - name: swift test
        working-directory: apps/ios/PhrenKit
        run: swift test

  app-build:
    name: App smoke build (iOS Simulator)
    runs-on: macos-15
    needs: phrenkit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Phren.xcodeproj \
            -scheme Phren \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
