# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && cd apps/ios && xcodegen generate
# The .xcodeproj is generated locally and gitignored — this file is the
# source of truth for project settings.
name: Phren
options:
  bundleIdPrefix: com.phren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PhrenKit:
    path: PhrenKit

targets:
  Phren:
    type: application
    platform: iOS
    sources:
      - Phren
    dependencies:
      - package: PhrenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phren.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only HTTPS via the system stack — declaring this up front avoids the
        # export-compliance prompt on every TestFlight upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: true
